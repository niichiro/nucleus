[workspace]
resolver = "2"
members = ["crates/*"]
# node/ (esp-idf, отдельный workspace по мере готовности железа) и app/ (Yew UI, Фаза 3)
# сознательно вне workspace: не собираются на хосте и ломают cargo build в корне.
exclude = ["node", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/niichiro/nucleus"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
async-trait = "0.1"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"

# Профиль для встраиваемых целей (nucleusd на Orange Pi)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
