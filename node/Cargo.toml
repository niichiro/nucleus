[package]
name = "nucleus-node"
version = "0.1.0"
edition = "2021"
description = "Прошивка узла Nucleus для ESP32-C3: BLE-периферия + ESP-NOW mesh"

# Отдельный от crates/* workspace: esp-idf собирается собственным тулчейном
# (riscv32imc-esp-espidf + ldproxy), корневой workspace его исключает.

[[bin]]
name = "nucleus-node"
path = "src/main.rs"

[dependencies]
nucleus-core = { path = "../crates/nucleus-core" }
esp-idf-svc = { version = "0.51", features = ["binstart"] }
esp32-nimble = { version = "0.12", features = ["esp-idf-svc"] }
log = "0.4"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
